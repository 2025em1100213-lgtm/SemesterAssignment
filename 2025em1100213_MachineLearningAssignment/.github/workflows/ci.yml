name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests (feature engineering + API contract)
        run: pytest tests/ -v

      - name: Lint check (basic syntax / import sanity)
        run: python -m py_compile src/*.py serving/*.py scripts/*.py monitoring/*.py

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Generate demo training data + train model
        run: |
          pip install -r requirements.txt
          python -c "
          import sys; sys.path.append('.')
          from src.data import generate_synthetic_customers
          import os
          os.makedirs('data/processed', exist_ok=True)
          generate_synthetic_customers(2000, '2024-01-01', 1).to_csv('data/processed/training_data.csv', index=False)
          "
          python scripts/train.py

      - name: Build Docker image
        run: docker build -t churn-serving:ci .
