data:
  processed_path: "data/processed/training_data.csv"
  target_col: "churn"
  test_size: 0.15
  val_size: 0.15
  random_state: 42

features:
  numeric_raw:
    - tenure_months
    - monthly_charges
    - total_charges
    - senior_citizen
    - has_partner
    - has_dependents
    - paperless_billing
    - multiple_lines
    - online_security
    - online_backup
    - device_protection
    - tech_support
    - streaming_tv
    - streaming_movies
  categorical_raw:
    - contract_type
    - payment_method
    - internet_service

model:
  baseline:
    type: "logistic_regression"
    params:
      max_iter: 1000
      C: 1.0
  candidate:
    type: "gradient_boosting"
    params:
      n_estimators: 200
      max_depth: 3
      learning_rate: 0.05

promotion_guardrail:
  min_auc: 0.80
  max_allowed_regression_vs_baseline: 0.01

artifacts:
  model_dir: "models"
  eval_dir: "artifacts/eval"
  registry_path: "models/registry.json"
  feature_stats_path: "artifacts/eval/feature_stats.json"
